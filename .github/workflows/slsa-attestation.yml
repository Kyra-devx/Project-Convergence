name: SLSA Attestation
on:
  release:
    types: [published]
permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: "./**"
